[project]
name = "shopee-food-online-receipt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
backend = [
    "fastapi>=0.162,<1",
    "langchain>=1.4,<2",
    "langchain-core>=1.7,<2",
    "langchain-openai>=1.7,<2",
    "langgraph>=1.2,<2",
    "pydantic>=2.14,<3",
    "pymupdf>=1.28,<2",
    "python-multipart>=0.0.33",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54,<1",
]
frontend = [
    "httpx>=0.28,<1",
    "streamlit[pdf]>=1.66,<2",
]

dev = [
    "datasets>=5.1.0",
    "python-dotenv>=1.2.4",
    "transformers>=5.22.1",
]

[tool.pyright]
executionEnvironments = [
    { root = "backend/src" },
    { root = "frontend/src" },
]